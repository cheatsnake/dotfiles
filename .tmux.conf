set -g status-style "bg=#353c4a, fg=#FFFFFF"
set -g default-terminal xterm-256color
set -g default-shell /usr/bin/zsh 
set -g prefix C-a
set -g history-limit 1000
set -g base-index 1
set -g pane-base-index 1
set -g status-right '#[fg=red,bg=default]#(somecommand.bash) #[fg=yellow]%d.%m / %H:%M'
set -g terminal-overrides ",xterm-256color:Tc"
set -g mouse on

set -g window-status-current-style 'fg=#4d5669 bg=#86bfcf bold'
set -g window-status-current-format ' #I#[fg=#4d5669]:#[fg=#4d5669]#W#[fg=#4d5669]#F '

set -g window-status-style 'fg=#cccccc bg=#4d5669'
set -g window-status-format ' #I#[fg=#cccccc]:#[fg=#cccccc]#W#[fg=#cccccc]#F '

set -g window-status-bell-style 'fg=white bg=colour1 bold'
set -sg escape-time 10
